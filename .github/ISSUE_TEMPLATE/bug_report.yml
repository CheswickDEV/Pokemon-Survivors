name: Spielfehler
description: Einen reproduzierbaren Fehler melden
body:
  - type: input
    id: version
    attributes:
      label: Spielversion, Windows-Version und Browser
      placeholder: 1.0.0-rc.1, Windows 11, Edge
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Schritte, erwartetes und beobachtetes Ergebnis
      description: Bitte Laufart, Schwierigkeit, Ort, Partner und Spielzeit nennen.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Weitere Hinweise
      description: Fehlermeldung oder Screenshot. Persönliche Browserdaten bitte entfernen.
