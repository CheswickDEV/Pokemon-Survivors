name: Game bug
description: Report a reproducible game issue
body:
  - type: input
    id: version
    attributes:
      label: Game version, operating system, browser and language
      placeholder: 1.0.0-rc.6.5, Windows 11, Edge, English
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Include run mode, difficulty, location, partners and game time.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional information
      description: Error message or screenshot. Remove personal browser data first.
